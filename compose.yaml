services:

  erp:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: mini-erp
    volumes:
      - .:/var/www
    env_file:
      - .env
    environment:
      TZ: ${APP_TIMEZONE:-America/Sao_Paulo}
    depends_on:
      - redis

  nginx:
    image: nginx:alpine
    container_name: mini-erp-nginx
    ports:
      - "8001:80"
    volumes:
      - .:/var/www
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - erp

  redis:
    image: redis:7-alpine
    container_name: mini-erp-redis
